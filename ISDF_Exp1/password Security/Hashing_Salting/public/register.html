<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        #strength {
            margin-top: 10px;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
        }

        .low {
            background: #ffcccc;
            color: #b00000;
        }

        .medium {
            background: #fff0b3;
            color: #996600;
        }

        .high {
            background: #ccffcc;
            color: #006600;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 6px;
            word-break: break-word;
        }

        .hash {
            background: white;
            padding: 10px;
            margin-top: 5px;
            font-size: 12px;
            word-break: break-all;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #555;
        }

        .login-link a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        .security {
            margin-top: 20px;
            padding: 12px;
            background: #e8f4ff;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Account</h1>
    <p class="subtitle">Create your new account</p>


    <label for="username">Username</label>
    <input type="text"id="username" placeholder="Enter username">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Create a password" oninput="checkPassword()">
    <div id="strength">Enter a password</div>
    <button onclick="registerUser()">Create Account</button>

    <div id="registerMessage" class="message" style="display:none;"></div>

    <div class="security">
        <strong>Security:</strong>
        <br><br>
        Your password is analyzed for strength
        and securely hashed with a unique salt
        before being stored.
    </div>

    <div class="login-link">Already have an account?
        <a href="/login.html">Login</a>
    </div>
</div>

<script>

// For password strength checking
function checkPassword() {
    const password =
        document.getElementById("password").value;
    const strength =
        document.getElementById("strength");
    let score = 0;

    if (password.length >= 8) {
        score++;
    }
    if (/[A-Z]/.test(password)) {
        score++;
    }
    if (/[a-z]/.test(password)) {
        score++;
    }
    if (/[0-9]/.test(password)) {
        score++;
    }
    if (/[^A-Za-z0-9]/.test(password)) {
        score++;
    }

    strength.classList.remove(
        "low",
        "medium",
        "high"
    );

    if (password.length === 0) {
        strength.innerHTML ="Enter a password";
    }

    else if (score <= 2) {
        strength.innerHTML =
            "LOW STRENGTH";
        strength.classList.add("low");
    }

    else if (score <= 4) {
        strength.innerHTML =
            "MEDIUM STRENGTH";
        strength.classList.add("medium");
    }

    else {
        strength.innerHTML =
            "HIGH STRENGTH";
        strength.classList.add("high");
    }
}

// Register user function
async function registerUser() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("registerMessage");

    if (!username || !password) {
        message.style.display = "block";
        message.innerHTML = "Please enter username and password.";
        return;
    }

    try {
        const response =
            await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

        const data = await response.json();
        message.style.display = "block";

        if (data.success) {
            message.innerHTML = `
                <strong>
                    Registration successful! 🎉
                </strong>

                <br><br>

                Password Strength:
                <strong>${data.strength}</strong>

                <br><br>

                Salt:
                <div class="hash">
                    ${data.salt}
                </div>

                <br>

                Password Hash:
                <div class="hash">
                    ${data.hash}
                </div>

                <br>

                <a href="/login.html">
                    Continue to Login →
                </a>
            `;
        }

        else {
            message.innerHTML =
                data.message;
        }
    }

    catch (error) {
        message.style.display = "block";
        message.innerHTML =
            "Unable to connect to server.";
    }

}
</script>
</body>
</html>
