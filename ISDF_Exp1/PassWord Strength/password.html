<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Analysis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin-top: 15px;
            font-size: 16px;
        }

        .strength {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
        }

        .low {
            background: #ffcccc;
            color: #cc0000;
        }

        .medium {
            background: #fff0b3;
            color: #996600;
        }

        .high {
            background: #ccffcc;
            color: #006600;
        }

        .requirements {
            margin-top: 20px;
        }

        .requirements p {
            margin: 7px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Login</h1>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        oninput="checkPassword()"
    >

    <div id="strength" class="strength">
        Enter a password
    </div>

    <div class="requirements">
        <p id="length">❌ At least 8 characters</p>
        <p id="uppercase">❌ Contains uppercase letter</p>
        <p id="lowercase">❌ Contains lowercase letter</p>
        <p id="number">❌ Contains a number</p>
        <p id="special">❌ Contains special character</p>
    </div>

</div>

<script>

function checkPassword() {

    const password = document.getElementById("password").value;

    const strengthBox = document.getElementById("strength");

    // Password conditions
    const hasLength = password.length >= 8;
    const hasUppercase = /[A-Z]/.test(password);
    const hasLowercase = /[a-z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasSpecial = /[^A-Za-z0-9]/.test(password);

    // Update requirement display
    document.getElementById("length").innerHTML =
        (hasLength ? "✅" : "❌") + " At least 8 characters";

    document.getElementById("uppercase").innerHTML =
        (hasUppercase ? "✅" : "❌") + " Contains uppercase letter";

    document.getElementById("lowercase").innerHTML =
        (hasLowercase ? "✅" : "❌") + " Contains lowercase letter";

    document.getElementById("number").innerHTML =
        (hasNumber ? "✅" : "❌") + " Contains a number";

    document.getElementById("special").innerHTML =
        (hasSpecial ? "✅" : "❌") + " Contains special character";


    // Calculate score
    let score = 0;

    if (hasLength) score++;
    if (hasUppercase) score++;
    if (hasLowercase) score++;
    if (hasNumber) score++;
    if (hasSpecial) score++;

    // Remove previous classes
    strengthBox.classList.remove("low", "medium", "high");


    // Determine password strength
    if (password.length === 0) {

        strengthBox.innerHTML = "Enter a password";

    } else if (score <= 2) {

        strengthBox.innerHTML = "🔴 LOW STRENGTH";
        strengthBox.classList.add("low");

    } else if (score <= 4) {

        strengthBox.innerHTML = "🟡 MEDIUM STRENGTH";
        strengthBox.classList.add("medium");

    } else {

        strengthBox.innerHTML = "🟢 HIGH STRENGTH";
        strengthBox.classList.add("high");

    }
}

</script>

</body>
</html>
